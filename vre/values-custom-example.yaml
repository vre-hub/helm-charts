# Example deployment-specific values for the escape-vre chart.
# Copy this file (e.g. to values-custom.yaml, which is gitignored) and revise
# every value before deploying. Anything not listed here has a generic default
# in values.yaml.

bootstrap:
  # Credentials for the initial admin user of REANA. These are used only during the first deployment.
  reanaAdminEmail: "admin@example.com"
  reanaAdminPassword: "defaultpassword"

jupyterhub:
  hub:
    config:
      RucioAuthenticator:
        # -- Credentials for accessing identity provider (IAM in this case). Must be set for authentication to work, must have token-exchange permissions in IAM.
        # During production deployment, these credentials are best set in a Kubernetes secret, and linked with GitOps settings. 
        client_id:
        client_secret:
        # -- URLs for the identity provider (IAM in this case). Must be set for authentication to work.
        authorize_url: https://iam-et.cloud.cnaf.infn.it/authorize
        token_url: https://iam-et.cloud.cnaf.infn.it/token
        userdata_url: https://iam-et.cloud.cnaf.infn.it/userinfo
        # -- Must be https://<jupyterhub.ingress.hosts[0]>/hub/oauth_callback
        # and registered as a redirect URI in the IAM client above.
        oauth_callback_url: https://vre.example.local/hub/oauth_callback
    
  singleuser:
    # -- To mount an rclone remote (RcloneMount.enabled below), uncomment and
    # keep ALL entries: these lists replace the defaults wholesale, and the
    # rucio/conda hook volumes are required by the postStart hooks. The
    # jupyterhub-shared claimName must match RcloneMount.pvcName; /data is
    # where the rucio-jupyterlab extension expects the default RSE
    # (RUCIO_RSE_MOUNT_PATH) in "replica" mode.
    # storage:
    #   extraVolumes:
    #   - name: jupyterhub-shared
    #     persistentVolumeClaim:
    #       claimName: data-rclone-pvc
    #   - name: rucio-client-setup
    #     configMap:
    #       name: rucio-client-setup
    #       defaultMode: 0o755
    #   - name: conda-setup
    #     configMap:
    #       name: conda-setup
    #       defaultMode: 0o755
    #   extraVolumeMounts:
    #   - name: jupyterhub-shared
    #     mountPath: /data
    #     readOnly: true
    #   - name: rucio-client-setup
    #     mountPath: /hooks/rucio
    #   - name: conda-setup
    #     mountPath: /hooks/conda

    extraEnv:
      # -- Rucio instance for this deployment. These variables are consumed by
      # configure-vre.py in the singleuser image, which writes the
      # rucio-jupyterlab extension config; base and auth URLs are also reused
      # by the rucio CLI postStart hook (see rucioClientSetup below).
      RUCIO_BASE_URL: "https://vre-rucio.cern.ch"
      RUCIO_AUTH_URL: "https://vre-rucio-auth.cern.ch"
      # Default RSE for uploads via the jupyterlab extension
      RUCIO_DESTINATION_RSE: "CERN-EOS"
      RUCIO_NAME: "vre-rucio.cern.ch"
      RUCIO_DISPLAY_NAME: "RUCIO - CERN VRE"
      RUCIO_SITE_NAME: "CERN"

      # -- Optionally provision a named conda environment at first login.
      # Both CONDA_ENV_NAME and CONDA_ENV_SOURCE_URL must be set together.
      # CONDA_ENV_NAME: "IGWN"
      # CONDA_ENV_SOURCE_URL: "https://computing.docs.ligo.org/conda/environments/linux-aarch64/igwn.yaml"
      # CONDA_PKGS_EXCLUDE: "_x86_64-microarch-level=3=3_haswell"

    # -- Spawn profiles: NOTE that this list wholesale-replaces the default in
    # values.yaml. Entries without kubespawner_override use singleuser.image;
    # kubespawner_override.image is a raw "name:tag" string.
    # profileList:
    #   - display_name: "Default environment"
    #     description: "Scipy notebook with the rucio jupyterlab extension and the reana client."
    #     default: true
    #   - display_name: "My community environment"
    #     description: "Community-specific image."
    #     kubespawner_override:
    #       image: ghcr.io/my-org/my-community-image:1.2.3
    #       image_pull_policy: IfNotPresent

  ingress:
    ingressClassName: null
    hosts:
    # -- Set the host for the JupyterHub ingress. This should be set to the domain name you want to use for accessing JupyterHub.
    # Keep RucioAuthenticator.oauth_callback_url above in sync with this host.
    - vre.example.local

# Rucio CLI configuration (rucio.cfg written by the postStart hook); server
# URLs and auth type come from jupyterhub.singleuser.extraEnv above.
rucioClientSetup:
  oidc:
    # -- Issuer nickname of your IAM as configured in the Rucio server
    issuer: "escape-iam"
  # -- Optional: additional Rucio servers (multi-RI/VO) for the CLI's
  # multi-host support. Each entry gets its own rucio_N.cfg; the primary
  # server (extraEnv RUCIO_BASE_URL) is labelled with primaryServerLabel,
  # falling back to RUCIO_NAME.
  # primaryServerLabel: "RI-1 server"
  # additionalServers:
  #   - label: "RI-2 server"
  #     baseUrl: "https://rucio.ri-2.example.org"
  #     authUrl: "https://rucio-auth.ri-2.example.org"

reana:
  secrets:
    login:
      iam:
        # IAM client for REANA, can be the same as the one used for JupyterHub, but do not need to have token-exchange permissions in IAM.
        consumer_key:
        consumer_secret:

    # REANA database credentials: unset = the reana subchart falls back to dev
    # defaults. In production manage the `<release-name>-db-secrets` Kubernetes
    # secret directly instead of setting credentials here.
    # database:
    #   user:
    #   password:

  # -- Domain name for the REANA ingress. REANA generates its OIDC callback
  # from this: register https://<reana_hostname>/oauth/authorized/keycloak/
  # as a redirect URI in your IAM client (the "keycloak" path segment is fixed
  # by reana-server regardless of login[].name; only the first login provider
  # is used).
  reana_hostname: "reana-vre.example.local"

  # REANA database connection: defaults in values.yaml match the bootstrap job
  # and the reana-db subchart. Uncomment and override only for an external DB
  # or a different release name (see "Release name assumptions" in the README).
  # NOTE: db_env_config must map to a dict — never leave it empty/null, that
  # deletes the defaults.
  # db_env_config:
  #   REANA_DB_HOST: "my-external-db"

  # -- These settings are used to configure the login options for REANA. 
  login:
    - name: "iam"
      type: "keycloak"
      config:
        title: "ET IAM"
        base_url: "https://iam-et.cloud.cnaf.infn.it"
        realm_url: "https://iam-et.cloud.cnaf.infn.it"
        auth_url: "https://iam-et.cloud.cnaf.infn.it/authorize"
        token_url: "https://iam-et.cloud.cnaf.infn.it/token"
        userinfo_url: "https://iam-et.cloud.cnaf.infn.it/userinfo"

nfs-server-provisioner:
  # Cluster-specific backing storage for the NFS server (e.g. "standard",
  # "local-path", ...) and its size.
  persistence:
    storageClass: standard
    size: 100M
  # NOTE: the exported storage class name (nfs-server-provisioner.storageClass.name)
  # MUST start with the Helm release name; the default assumes "escape-vre".
  # See "Release name assumptions" in the README.

npdb:
  postgresql:
    auth:
      password: replace-with-a-strong-password
  files:
    authentication:
      # IAM userinfo endpoint used to authenticate npdb file access
      userinfoUrl: https://iam-et.cloud.cnaf.infn.it/userinfo
