# Bootstrap configuration for the VRE Helm chart
bootstrap:
  enabled: true
  image:
    repository: alpine/k8s
    tag: "1.30.14"
    pullPolicy: IfNotPresent
  initImage:
    repository: postgres
    tag: "17.5"
    pullPolicy: IfNotPresent

  reanaAdminEmail:
  reanaAdminPassword:

jupyterhub:
  enabled: true

  proxy:
    service:
      type: ClusterIP
  hub:
    service:
      type: ClusterIP
    # network policy needs to be modified to allow access to the Rucio server
    # (disabling it for now as a workaround, see also the ones for singleuser and proxy below)
    networkPolicy:
      enabled: false
    db:
      #upgrade: true
      type: postgres # passed as s secret (dbconnect string) from the jhub-vre-db secret
      url: # set through secret

    config:
      JupyterHub:
        authenticator_class: "generic-oauth"
      RucioAuthenticator:
        client_id:
        client_secret:
        authorize_url: https://iam-escape.cloud.cnaf.infn.it/authorize
        token_url: https://iam-escape.cloud.cnaf.infn.it/token
        userdata_url: https://iam-escape.cloud.cnaf.infn.it/userinfo
        # Required: https://<jupyterhub.ingress.hosts[0]>/hub/oauth_callback,
        # registered as a redirect URI in the IAM client above.
        oauth_callback_url:
        username_key: preferred_username
        enable_auth_state: true
        allow_all: true
        scope:
          - openid
          - profile
          - email


    extraConfig:

      token-exchange: |
        import pprint
        import os
        import warnings
        import requests
        from oauthenticator.generic import GenericOAuthenticator

        # custom authenticator to enable auth_state and get access token to set as env var for rucio extension
        class RucioAuthenticator(GenericOAuthenticator):
            def __init__(self, **kwargs):
                super().__init__(**kwargs)
                self.enable_auth_state = True

            def exchange_token(self, token):
                params = {
                    'client_id': self.client_id,
                    'client_secret': self.client_secret,
                    'grant_type': 'urn:ietf:params:oauth:grant-type:token-exchange',
                    'subject_token_type': 'urn:ietf:params:oauth:token-type:access_token',
                    'subject_token': token,
                    'scope': 'openid profile',
                    'audience': 'rucio'
                }
                response = requests.post(self.token_url, data=params)
                print("EXCHANGE TOKEN for params", params)
                print(response.json())
                rucio_token = response.json()['access_token']

                return rucio_token

            async def pre_spawn_start(self, user, spawner):
                auth_state = await user.get_auth_state()
                #print("AUTH_state")
                #pprint.pprint(auth_state)
                if not auth_state:
                    # user has no auth state
                    return False

                # define token environment variable from auth_state
                spawner.environment['RUCIO_ACCESS_TOKEN'] = self.exchange_token(auth_state['access_token'])
                spawner.environment['EOS_ACCESS_TOKEN'] = auth_state['access_token']
                spawner.environment['NOPAYLOADDB_TOKEN'] = auth_state['access_token']

        # set the above authenticator as the default
        c.JupyterHub.authenticator_class = RucioAuthenticator

        # enable authentication state
        c.GenericOAuthenticator.enable_auth_state = True

  singleuser:
    cloudMetadata:
      blockWithIptables: false



    defaultUrl: "/lab"
    # The lifecycle hooks are used to create the Rucio configuration file,
    # and the token file by copying the REFRESH_TOKEN from the environment variable to the token file.
    startTimeout: 1200

    lifecycleHooks:
      postStart:
        exec:
          command:
            - "sh"
            - "-c"
            - |
              bash /hooks/rucio/postStart_rucio.sh > /tmp/postStart_rucio.log 2>&1 || true
              bash /hooks/conda/postStart_conda.sh > /tmp/postStart_conda.log 2>&1 || true

    networkPolicy:
      enabled: false


    storage:
      capacity: 100Gi

      # NOTE: these lists are subchart values, so they replace wholesale when
      # overridden - if you add a volume in your local values file you must
      # copy the full lists, INCLUDING the rucio/conda hook entries below
      # (see values-custom-example.yaml for a ready-to-copy block).
      # To mount an rclone remote (RcloneMount.enabled), add a volume whose
      # claimName matches RcloneMount.pvcName, typically mounted at /data:
      # the rucio-jupyterlab extension expects the default RSE there
      # (RUCIO_RSE_MOUNT_PATH) when RUCIO_MODE is "replica".
      extraVolumes:
        # Arbitrary key for identity & ordering
      - name: rucio-client-setup
        configMap:
          name: rucio-client-setup
          defaultMode: 0o755
      - name: conda-setup
        configMap:
          name: conda-setup
          defaultMode: 0o755
      extraVolumeMounts:
        # Arbitrary key for identity & ordering
      - name: rucio-client-setup
        mountPath: /hooks/rucio
      - name: conda-setup
        mountPath: /hooks/conda

    image:
      name: ghcr.io/vre-hub/vre-singleuser-py311
      tag: sha-281055c
      pullPolicy: Always


    # Spawn profiles offered to users. Each entry is a named delta against the
    # base singleuser.* configuration: kubespawner_override patches only the
    # listed keys, everything else (extraEnv, storage, lifecycle hooks, ...)
    # is inherited. An entry without kubespawner_override spawns singleuser.image.
    # NOTE: kubespawner_override uses raw kubespawner syntax: image is a single
    # "name:tag" string (unlike singleuser.image) and the pull policy key is
    # image_pull_policy. The prePuller also pre-pulls override images.
    profileList:
      - display_name: "Default environment"
        description: "Based on a scipy notebook environment with a python-3.11 kernel, the rucio jupyterlab extension and the reana client installed."
        default: true
      # - display_name: "My community environment"
      #   description: "Community-specific image."
      #   kubespawner_override:
      #     image: ghcr.io/my-org/my-community-image:1.2.3
      #     image_pull_policy: IfNotPresent

    # nodeSelector:
    #   jupyter: singleuser
    # extraTolerations:
    #   - key: jupyter
    #     operator: Equal
    #     value: singleuser
    #     effect: NoSchedule
    # memory:
    #   limit: 3.5G #4G
    #   guarantee: 3G #2G

    cmd: null
    extraEnv:
      # --- rucio-jupyterlab extension configuration -------------------------
      # The extension itself is NOT configured by environment variables: it
      # reads RucioConfig.instances from ~/.jupyter/jupyter_server_config.json
      # (see https://github.com/rucio/jupyterlab-extension, config/schema.py).
      # The singleuser image (vre-singleuser-py311 and images derived from it)
      # runs configure-vre.py at container startup, which maps the RUCIO_*
      # variables below into that file - so this is the image's interface, not
      # the extension's (see https://github.com/vre-hub/environments).
      # The rucio CLI is configured separately by the rucioClientSetup
      # postStart hook (see rucioClientSetup below), which reads only
      # RUCIO_BASE_URL, RUCIO_AUTH_URL and RUCIO_DEFAULT_AUTH_TYPE from here.
      #
      # Required: base and auth URLs of the Rucio server for this deployment.
      RUCIO_BASE_URL: ""
      RUCIO_AUTH_URL: ""
      # Instance name and labels shown by the jupyterlab extension
      RUCIO_NAME: ""
      RUCIO_DISPLAY_NAME: ""
      RUCIO_SITE_NAME: ""
      # Default RSE for uploads via the jupyterlab extension, and where the
      # extension expects that RSE to be mounted in the notebook filesystem
      RUCIO_DESTINATION_RSE: ""
      RUCIO_RSE_MOUNT_PATH: "/data"
      # replica: browse files on the mounted RSE; download: fetch to local disk
      RUCIO_MODE: "replica"
      RUCIO_WILDCARD_ENABLED: "1"
      # Auth type preselected in the extension; also reused as auth_type in the
      # rucio CLI config written by the postStart hook
      RUCIO_DEFAULT_AUTH_TYPE: "oidc"
      # Intended token source for the extension: the hub authenticator exchanges
      # the login token and injects it as RUCIO_ACCESS_TOKEN (see extraConfig
      # token-exchange above). NOTE: configure-vre.py currently does NOT map
      # these two into the extension config (the lines are commented out
      # there); they are kept as documentation of the intended wiring and will
      # take effect if the image restores the mapping.
      RUCIO_OIDC_AUTH: "env"
      RUCIO_OIDC_ENV_NAME: "RUCIO_ACCESS_TOKEN"
      # Further optional variables understood by configure-vre.py (defaults in
      # the image): RUCIO_WEBUI_URL, RUCIO_CA_CERT, RUCIO_VO,
      # RUCIO_REPLICATION_RULE_LIFETIME_DAYS, RUCIO_PATH_BEGINS_AT, and
      # ATLAS_/CMS_/FCC_-prefixed families for its extra hardcoded instances.

      # conda ENV variables used by conda-setup-configmap.yaml.
      # The conda baseline setup (user-writable env/pkgs dirs, .condarc, conda init)
      # always runs when condaSetup is enabled. To additionally provision a named
      # conda environment, set BOTH CONDA_ENV_NAME and CONDA_ENV_SOURCE_URL
      # (e.g. in your local values file).
      CONDA_ENV_NAME: ""
      CONDA_ENV_SOURCE_URL: ""
      # Optional grep -E pattern of packages to exclude from the environment file
      CONDA_PKGS_EXCLUDE: ""

      # HSF CDB client ENV variables
      # NOTE: assumes the release is named "escape-vre"; keep in sync with npdb.hosts
      NOPAYLOADDB_URL: "http://escape-vre-npdb-nginx"
      NOPAYLOADDB_FILES_URL: "http://escape-vre-npdb-nginx"
      NOPAYLOADDB_SOURCE_NAME: "Escape VRE HSF CDB" # recommended in case of multiple instances
      # If there is a second HSF CDB instance to connect to, the following ENV vars are mandatory
      #NOPAYLOADDB_RI2_URL: ""
      #NOPAYLOADDB_RI2_FILES_URL: ""
      #NOPAYLOADDB_RI2_SOURCE_NAME: "Escape VRE HSF CDB RI2" # recommended in case of multiple instances

  prePuller:
    hook:
      enabled: true

  ingress:
    enabled: true
    ingressClassName: null
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
      ingress.kubernetes.io/ssl-redirect: "true"
      traefik.frontend.entryPoints: http,https
    hosts: []

reana:
  enabled: true

  # in 0.9.3 used to set alt passwords
  debug:
    enabled: false

  workspaces:
    retention_rules:
      maximum_period: forever
      cronjob_schedule: "0 2 * * *"  # everyday at 2am
    paths:
      - /var/reana:/var/reana

  shared_storage:
    backend: nfs
    volume_size: 1
    access_modes: ReadWriteMany

  secrets:
    login:
      iam:
        consumer_key:
        consumer_secret:

    # Initial credentials for the REANA database when installed by the reana-db
    # subchart. Left unset following upstream reana convention: the subchart's
    # secret template falls back to reana/reana (dev convenience). Production
    # deployments should manage the `<release-name>-db-secrets` Kubernetes
    # secret directly instead of setting credentials in values files.
    database: {}

  components:
    reana_ui:
      enabled: true
      local_users: false
    reana_db:
      enabled: true
    reana_server:
      environment:
        REANA_USER_EMAIL_CONFIRMATION: false
    # reana_workflow_controller:
    #   image: docker.io/mdonadoni/reana-workflow-controller:0.9.1-7e03f0a-cvmfs
    # reana_job_controller:
    #   image: docker.io/reanahub/reana-job-controller-htcondorcern-slurmcern:0.9.1
    reana_workflow_controller:
      imagePullPolicy: IfNotPresent
      image: docker.io/reanahub/reana-workflow-controller:0.9.4
      environment:
        SHARED_VOLUME_PATH: "/var/reana/"
        REANA_JOB_STATUS_CONSUMER_PREFETCH_COUNT: 10


  compute_backends:
    - "kubernetes"
    # - "htcondorcern"
    # - "slurmcern"

  notifications:
    enabled: false
    # email_config:
    #   receiver: escape-cern-ops@cern.ch
    #   sender: escape-cern-ops@cern.ch
    #   login: ""
    #   smtp_server: cernmx.cern.ch
    #   smtp_port: 25

  ingress_override: true

  # Required: domain name for the REANA ingress. REANA generates its OIDC
  # redirect URI from this (https://<reana_hostname>/oauth/authorized/keycloak/);
  # register it in your IAM client.
  reana_hostname:

  db_env_config:
    REANA_DB_NAME: "reana"
    REANA_DB_PORT: "5432"
    # NOTE: assumes the release is named "escape-vre" (the reana-db service is
    # named <release-name>-db). Override if you use a different release name.
    REANA_DB_HOST: "escape-vre-db"
    # There are two more environment variables that should be set in order
    # to connect to a database:
    # REANA_DB_USERNAME: containing the database user name.
    # REANA_DB_PASSWORD: containing the password for the user previously set.
    # Both environment variables should be set inside a Kubernetes secret:
    # `[release-name]-db`

  login:
    - name: "iam"
      type: "keycloak"
      # this is example, to be set on deployment
      config:
        title: "ESCAPE IAM"
        base_url: "https://iam-escape.cloud.cnaf.infn.it"
        realm_url: "https://iam-escape.cloud.cnaf.infn.it"
        auth_url: "https://iam-escape.cloud.cnaf.infn.it/authorize"
        token_url: "https://iam-escape.cloud.cnaf.infn.it/token"
        userinfo_url: "https://iam-escape.cloud.cnaf.infn.it/userinfo"

  ingress:
    enabled: false

  traefik:
    enabled: false

  quota:
    default_disk_limit: 10737418240  # bytes (10 GiB)
    default_cpu_limit: 36000000      # milliseconds (10 hours)

  fluent-bit:
    enabled: false

nfs-server-provisioner:
  enabled: true
  persistence:
    enabled: true
    storageClass: ""
    size: "10Gi"
  storageClass:
    # NOTE: this name MUST start with the Helm release name (here "escape-vre")
    # to be picked up by the reana-db and reana-shared-volume subcharts.
    # Keep npdb.storage.payload.storageClass in sync.
    name: escape-vre-shared-volume-storage-class
    # name: reana-infrastructure-volume-storage-class
    mountOptions:
    - tcp
    - nfsvers=4.1
    - retrans=2
    - timeo=30
  tolerations:
  - effect: NoSchedule
    key: CriticalAddonsOnly
    operator: "Exists"


# observability
# note that updated reana also contains prometheus and grafana, but they are not enabled by default

grafana:
  enabled: false

  testFramework:
    enabled: false

  persistentVolume:
    size: "1Gi"
  retention: "15d"

  prometheus-node-exporter:
    enabled: false


prometheus:
  enabled: false

loki:
  enabled: false

  # this is a minimal configuration for loki; the goal of the UC is not to test diverse loki features,
  # but to make sure that loki can collect meaningful logs from the DPPS components

  # needed to run in rancher
  # global:
  #   dnsService: "rke2-coredns-rke2-coredns"

  loki:
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
        enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    ruler:
      enable_api: true

    auth_enabled: false

  test:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
      lokiCanary:
        enabled: false

  minio:
    enabled: true

  deploymentMode: SingleBinary

  rollout_operator:
    enabled: false

  singleBinary:
    replicas: 1

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0


fluent-bit:
  enabled: false
  config:
    rbac:
      create: true
      eventsAccess: true

    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Buffer_Chunk_Size 1
          Refresh_Interval 1
          Skip_Long_Lines On


    outputs: |
      [FILTER]
          Name grep
          Match *

      [OUTPUT]
          Name        loki
          Match       *
          Host        {{ .Release.Name }}-loki-gateway
          port        80
          tls         off
          tls.verify  off


# Rucio client configuration for singleuser sessions (postStart hook script).
# Enabled by default: every VRE is expected to have a Rucio server to talk to.
# NOTE: if you disable this, you must also override
# jupyterhub.singleuser.lifecycleHooks and the corresponding
# extraVolumes/extraVolumeMounts, which reference this ConfigMap unconditionally
# (subchart values cannot depend on parent-chart flags).
rucioClientSetup:
  enabled: true
  configMapName: rucio-client-setup
  # OIDC settings written into the rucio CLI config (/opt/rucio/etc/rucio.cfg)
  # by the postStart hook. These configure the CLI only - the jupyterlab
  # extension is configured via the RUCIO_* variables in
  # jupyterhub.singleuser.extraEnv above. The server URLs and auth_type are
  # taken from RUCIO_BASE_URL/RUCIO_AUTH_URL/RUCIO_DEFAULT_AUTH_TYPE there,
  # so they are defined once.
  oidc:
    # Required: issuer nickname of your IAM as configured in the Rucio server
    # (e.g. "escape-iam")
    issuer: ""
    audience: "rucio"
    scope: "openid profile offline_access storage.read:/ storage.modify:/"
    polling: "true"
    refreshActivate: "true"
  # Multiple research infrastructures: additional Rucio servers for the CLI.
  # Each entry gets its own rucio_N.cfg rendered into the ConfigMap, plus a
  # multi_host_* stanza in rucio.cfg mapping labels to config files for the
  # commands listed in multiHostCommands. The primary server always comes from
  # extraEnv RUCIO_BASE_URL/RUCIO_AUTH_URL and is labelled with
  # primaryServerLabel (falling back to RUCIO_NAME). Additional servers
  # authenticate with the same exchanged token file by default.
  # (This replaces the former multiRI.enabled flag and the
  # RUCIO_MULTI_HOST_SERVERS/RUCIO_MULTI_HOST_COMMANDS env vars.)
  multiHostCommands: "whoami, ping, list, download"
  primaryServerLabel: ""
  additionalServers: []
  # - label: "RI-2 server"
  #   baseUrl: "https://rucio.ri-2.example.org"
  #   authUrl: "https://rucio-auth.ri-2.example.org"
  #   # Optional: authType (default "oidc"), oidcIssuer (placeholder by default,
  #   # unused with token-file auth)

# Conda baseline setup for singleuser sessions (postStart hook script):
# creates user-writable conda envs/pkgs dirs, .condarc and runs conda init,
# so that users have a working conda. Optionally provisions a named environment
# when CONDA_ENV_NAME and CONDA_ENV_SOURCE_URL are set (see singleuser.extraEnv).
# NOTE: if you disable this, you must also override
# jupyterhub.singleuser.lifecycleHooks and the corresponding
# extraVolumes/extraVolumeMounts, which reference this ConfigMap unconditionally
# (subchart values cannot depend on parent-chart flags).
condaSetup:
  enabled: true
  configMapName: conda-setup

# Mount a remote (e.g. WebDAV) via the csi-rclone driver as a read-only PV/PVC
# for singleuser sessions. Requires the csi-rclone CSI driver in the cluster.
# NOTE: enabling this creates the PV/PVC only - to mount it in user pods you
# must also add a volume with claimName matching pvcName to
# jupyterhub.singleuser.storage.extraVolumes/extraVolumeMounts (full lists,
# see values-custom-example.yaml; soft-checked in the post-install notes).
RcloneMount:
  enabled: false
  pvName: data-rclone-pv
  pvcName: data-rclone-pvc
  capacity: 10Gi
  storageClassName: rclone
  volumeHandle: rclone-data-id
  readOnly: true
  remoteName: rclone
  remoteUrl: ""
  remotePath: /
  vendor: other
  reclaimPolicy: Retain

crm:
  enabled: false
  namespace: monitoring

npdb:
  enabled: true
  platform: kubernetes

  backend:
    type: django

  hosts:
    # Cluster-internal access through the npdb NGINX Service.
    # NOTE: assumes the release is named "escape-vre" (the service is named
    # <release-name>-npdb-nginx). Override if you use a different release name,
    # and use distinct DNS names when enabling the ingress for external access.
    api: escape-vre-npdb-nginx
    files: escape-vre-npdb-nginx

  postgresql:
    enabled: true
    nameOverride: npdb-postgresql
    fullnameOverride: ""
    auth:
      username: cdb
      password: change-me
      database: cdb
    primary:
      persistence:
        enabled: true
        size: 8Gi

  django:
    replicas: 1
    migrations:
      enabled: true

  nginx:
    podSecurityContext:
      fsGroup: 101

  files:
    upload:
      enabled: true
    authentication:
      requireForDownloads: false
      userinfoUrl: https://iam-escape.cloud.cnaf.infn.it/userinfo

  storage:
    payload:
      create: true
      storageClass: escape-vre-shared-volume-storage-class
      size: 2Gi

  pgbouncer:
    enabled: false

  ingress:
    enabled: false
