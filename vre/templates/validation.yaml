{{- if not .Values.bootstrap.reanaAdminPassword }}
{{- fail "bootstrap.reanaAdminPassword must be set in values" }}
{{- end }}

{{- if not .Values.bootstrap.reanaAdminEmail }}
{{- fail "bootstrap.reanaAdminEmail must be set in values" }}
{{- end }}

{{- if not .Values.jupyterhub.hub.config.RucioAuthenticator.client_id }}
{{- fail "jupyterhub.hub.config.RucioAuthenticator.client_id must be set in values. It can be obtained from the identity provider: e.g. IAM or Keycloak." }}
{{- end }}

{{- if not .Values.jupyterhub.hub.config.RucioAuthenticator.client_secret }}
{{- fail "jupyterhub.hub.config.RucioAuthenticator.client_secret must be set in values. It can be obtained from the identity provider: e.g. IAM or Keycloak." }}
{{- end }}

{{- if not .Values.reana.secrets.login.iam.consumer_key }}
{{- fail "reana.secrets.login.iam.consumer_key must be set in values. It can be obtained from the identity provider: e.g. IAM or Keycloak." }}
{{- end }}

{{- if not .Values.reana.secrets.login.iam.consumer_secret }}
{{- fail "reana.secrets.login.iam.consumer_secret must be set in values. It can be obtained from the identity provider: e.g. IAM or Keycloak." }}
{{- end }}

{{- if not .Values.jupyterhub.hub.config.RucioAuthenticator.oauth_callback_url }}
{{- fail "jupyterhub.hub.config.RucioAuthenticator.oauth_callback_url must be set: https://<jupyterhub.ingress.hosts[0]>/hub/oauth_callback, registered as a redirect URI in your IAM client." }}
{{- end }}

{{- if not .Values.reana.reana_hostname }}
{{- fail "reana.reana_hostname must be set. REANA's OIDC redirect URI will be https://<reana_hostname>/oauth/authorized/keycloak/ - register it in your IAM client." }}
{{- end }}

{{- if and .Values.jupyterhub.enabled .Values.jupyterhub.ingress.enabled (not .Values.jupyterhub.ingress.hosts) }}
{{- fail "jupyterhub.ingress.hosts must contain at least one host. The oauth_callback_url is based on this host." }}
{{- end }}

{{- if .Values.jupyterhub.enabled }}
{{- if not .Values.jupyterhub.singleuser.extraEnv.RUCIO_BASE_URL }}
{{- fail "jupyterhub.singleuser.extraEnv.RUCIO_BASE_URL must be set: URL of the Rucio server (used by the rucio-jupyterlab extension and the rucio client postStart hook)." }}
{{- end }}
{{- if not .Values.jupyterhub.singleuser.extraEnv.RUCIO_AUTH_URL }}
{{- fail "jupyterhub.singleuser.extraEnv.RUCIO_AUTH_URL must be set: URL of the Rucio auth server (used by the rucio-jupyterlab extension and the rucio client postStart hook)." }}
{{- end }}
{{- if not .Values.rucioClientSetup.oidc.issuer }}
{{- fail "rucioClientSetup.oidc.issuer must be set: issuer nickname of your IAM as configured in the Rucio server (written into the rucio CLI's rucio.cfg)." }}
{{- end }}
{{- end }}

{{- if and .Values.npdb.enabled (not (dig "postgresql" "auth" "existingSecret" "" .Values.npdb)) }}
{{- $npdbPassword := dig "postgresql" "auth" "password" "" .Values.npdb }}
{{- if not $npdbPassword }}
{{- fail "npdb.postgresql.auth.password must be set, or npdb.postgresql.auth.existingSecret" }}
{{- end }}
{{- if eq $npdbPassword "change-me" }}
{{- fail "npdb.postgresql.auth.password must be changed from the default 'change-me'" }}
{{- end }}
{{- end }}

{{- if .Release.IsInstall }}
{{- $defaults := list "defaultpassword" "replace-with-a-strong-password" "change-me" "1234" "secret_key" }}

{{- if and (dig "components" "reana_db" "enabled" true .Values.reana) (not (dig "debug" "enabled" false .Values.reana)) }}
{{- $db := dig "database" dict .Values.reana.secrets | default dict }}
{{- if or (not (has (dig "user" "" $db | default "") (list "" "reana"))) (not (has (dig "password" "" $db | default "") (list "" "reana"))) }}
{{- fail "reana.secrets.database must be left unset on install, the bundled REANA database always starts as reana/reana. Change it after install, see \"Credentials\" in the README" }}
{{- end }}
{{- end }}

{{- if and .Values.bootstrap.enabled (has .Values.bootstrap.reanaAdminPassword $defaults) }}
{{- fail "bootstrap.reanaAdminPassword is set to a known example value, choose your own" }}
{{- end }}

{{- if and .Values.npdb.enabled (not (dig "postgresql" "auth" "existingSecret" "" .Values.npdb)) (has (dig "postgresql" "auth" "password" "" .Values.npdb) $defaults) }}
{{- fail "npdb.postgresql.auth.password is set to a known example value, choose your own" }}
{{- end }}

{{- $broker := dig "message_broker" "password" "" .Values.reana.secrets }}
{{- if or (not $broker) (has $broker $defaults) }}
{{- fail "reana.secrets.message_broker.password must be set, otherwise REANA uses the default password \"1234\"" }}
{{- end }}

{{- $key := dig "reana" "REANA_SECRET_KEY" "" .Values.reana.secrets }}
{{- if or (not $key) (has $key $defaults) }}
{{- fail "reana.secrets.reana.REANA_SECRET_KEY must be set, otherwise REANA uses the default key \"secret_key\"" }}
{{- end }}
{{- end }}
