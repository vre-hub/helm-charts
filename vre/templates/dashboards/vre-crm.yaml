{{- if .Values.crm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vre-crm-dashboard
  namespace: {{ .Values.crm.namespace }}
  labels:
    grafana_dashboard: "1"  # Must match sidecar label
